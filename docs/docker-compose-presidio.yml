version: '3'
services:
  presidio-analyzer:
    image: mcr.microsoft.com/presidio-analyzer:latest
    ports:
      - "5002:3000"
    environment:
      - PRESIDIO_ANALYZER_LOG_LEVEL=INFO
    restart: always
    networks:
      - presidio-net

  presidio-anonymizer:
    image: mcr.microsoft.com/presidio-anonymizer:latest
    ports:
      - "5001:3000"
    environment:
      - PRESIDIO_ANONYMIZER_LOG_LEVEL=INFO
    restart: always
    networks:
      - presidio-net

networks:
  presidio-net:
    driver: bridge 