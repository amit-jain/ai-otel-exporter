# Test-specific properties for metrics/telemetry
AI_OTEL_METRICS_ENABLED=true
AI_OTEL_METRICS_PREFIX=test_
SERVICE_NAME=test-typed-extractor

# OTLP configuration for tests (matching TypedAttributeExtractorTest static block)
OTLP_EXPORT=true
OTLP_EXPORTER=http://localhost:4317
OTEL_BSP_SCHEDULE_DELAY=500

# Quarkus Micrometer settings for the test context
quarkus.micrometer.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.registry-enabled-default=true
# Ensure this is true so the default Prometheus registry is available for MetricsProducer to use 